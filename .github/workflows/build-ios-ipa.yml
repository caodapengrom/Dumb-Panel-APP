name: Build iOS IPA (Unsigned)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Get dependencies
        run: flutter pub get

      - name: Generate iOS project if missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Fix Podfile platform version
        run: |
          cd ios
          if [ ! -f "Podfile" ]; then
            pod init
          fi
          sed -i '' '/^platform :ios/d' Podfile
          sed -i '' "1i\\
          platform :ios, '14.0'
          " Podfile
          echo "=== Podfile content ==="
          head -5 Podfile
          cd ..

      - name: Pod install
        run: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaidaiPanel-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
